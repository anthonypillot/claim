name: 🧪 On pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: on-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract-version:
    uses: anthonypillot/actions/.github/workflows/extract-version.yaml@main

  verify:
    name: 🧪 Verify
    needs: extract-version
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v6

      - name: 🐰 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Lint
        run: bun run lint

      - name: 📝 Check formatting
        run: bun run format:check

      - name: 🔎 Typecheck
        run: bun run typecheck

      - name: 🧪 Test
        run: bun test

      - name: 🏗️ Build
        run: bun run build

      - name: 🐳 Build image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/claim-api:${{ needs.extract-version.outputs.result }}
        run: docker build --file packages/api/Dockerfile --tag "$IMAGE" .

      - name: 🚀 Start image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/claim-api:${{ needs.extract-version.outputs.result }}
        run: docker run --detach --name claim-api-smoke --publish 3000:3000 "$IMAGE"

      - name: ❤️ Check image health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/health

      - name: 🛑 Stop image
        if: always()
        run: docker rm --force claim-api-smoke || true

  publish-preview:
    name: 🐳 Publish preview image
    needs: [extract-version, verify]
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v6

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📲 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/claim-api:${{ needs.extract-version.outputs.result }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ needs.extract-version.outputs.result }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
