name: 🏷️ On release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: 🐳 Publish ${{ matrix.image }} release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    strategy:
      matrix:
        include:
          - image: claim-api
            dockerfile: packages/api/Dockerfile
          - image: claim-web
            dockerfile: packages/web/Dockerfile

    steps:
      - name: 🏷️ Validate and derive image tags
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a stable vX.Y.Z release, received '$TAG'." >&2
            exit 1
          fi

          version="${TAG#v}"
          IFS=. read -r major minor _ <<< "$version"
          printf 'version=%s\nmajor=%s\nminor=%s.%s\n' "$version" "$major" "$major" "$minor" >> "$GITHUB_OUTPUT"

      - name: 📥 Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🔎 Resolve release revision
        id: revision
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📲 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: 🐳 Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
