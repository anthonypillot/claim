name: 🏷️ On Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🐰 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏷️ Check release version
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a stable vX.Y.Z release, received '$TAG'." >&2
            exit 1
          fi

          version="${TAG#v}"
          IFS=. read -r major minor _ <<< "$version"
          bun scripts/check-versions.mjs "$version"
          printf 'version=%s\nmajor=%s\nminor=%s.%s\n' "$version" "$major" "$major" "$minor" >> "$GITHUB_OUTPUT"

      - name: 🌐 Install Playwright browser
        run: bun run --cwd packages/web playwright install --with-deps chromium

      - name: 🏗️ Build
        run: bun run verify

  images:
    name: 🐳 Build and publish ${{ matrix.image }} release
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claim-api
            dockerfile: packages/api/Dockerfile
          - image: claim-web
            dockerfile: packages/web/Dockerfile
    uses: ./.github/workflows/build-publish-image.yaml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      publish: true
      tags: |
        ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.build.outputs.version }}
        ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.build.outputs.minor }}
        ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.build.outputs.major }}
        ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
      version: ${{ needs.build.outputs.version }}
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: 🚀 Deploy ${{ matrix.image }} to ${{ matrix.environment }}
    needs: [build, images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claim-api
            environment: pre-production
            namespace: claim-api-prep
            deployment: claim-api-prep
            container: claim-api
          - image: claim-web
            environment: pre-production
            namespace: claim-web-prep
            deployment: claim-web-prep
            container: claim-web
          - image: claim-api
            environment: production
            namespace: claim-api-prod
            deployment: claim-api-prod
            container: claim-api
          - image: claim-web
            environment: production
            namespace: claim-web-prod
            deployment: claim-web-prod
            container: claim-web
    uses: anthonypillot/actions/.github/workflows/kubernetes-deployment.yaml@v1
    with:
      registry_url: ghcr.io
      registry_username: ${{ github.repository_owner }}
      deployment_name: ${{ matrix.deployment }}
      container_name: ${{ matrix.container }}
      environment: ${{ matrix.environment }}
      image_name: ${{ matrix.image }}
      image_tag: ${{ needs.build.outputs.version }}
      namespace_name: ${{ matrix.namespace }}
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}
