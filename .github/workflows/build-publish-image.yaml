name: 🐳 Build and publish image

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref to check out; defaults to the caller workflow ref.
        required: false
        type: string
        default: ""
      dockerfile:
        description: Dockerfile path relative to the repository root.
        required: true
        type: string
      image:
        description: Local image name used by the smoke test.
        required: true
        type: string
      publish:
        description: Whether to publish the verified image tags.
        required: false
        type: boolean
        default: false
      tags:
        description: Newline-separated image tags to build and optionally publish.
        required: true
        type: string
      version:
        description: Image version written to the OCI metadata.
        required: true
        type: string
    secrets:
      registry-token:
        description: Token used to publish the image to GHCR.
        required: true

jobs:
  image:
    name: 🐳 Build and publish ${{ inputs.image }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: 🔎 Resolve image revision
        id: revision
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🐋 Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          load: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ inputs.image }}:smoke
            ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: 🚀 Start image
        run: >-
          docker run --detach --name "${{ inputs.image }}-smoke" --platform linux/amd64
          --publish 3000:3000
          --env PUBLIC_API_URL=http://127.0.0.1:3000
          --env PUBLIC_PLAUSIBLE_URL=https://plausible.monitoring.anthonypillot.com
          --env PUBLIC_WEB_URL=http://127.0.0.1:3000
          --env ORIGIN=http://127.0.0.1:3000
          --env ROBOTS_ALLOW_INDEXING=false
          "${{ inputs.image }}:smoke"

      - name: ❤️ Check image health
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/health

      - name: 🛑 Stop image
        if: always()
        run: docker rm --force "${{ inputs.image }}-smoke" || true

      - name: 📲 Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token }}

      - name: 📤 Publish verified image
        if: ${{ inputs.publish }}
        env:
          IMAGE_TAGS: ${{ inputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker image push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
