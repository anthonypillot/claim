name: 🚀 Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag to deploy (for example, v1.0.2).
        required: true
        type: string
      environment:
        description: Environment to deploy to.
        required: false
        type: string
        default: both
    secrets:
      KUBECONFIG:
        description: Base64-encoded kubeconfig used by the deployment workflow.
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to deploy (for example, v1.0.2).
        required: true
        type: string
      environment:
        description: Environment to deploy to.
        required: true
        type: choice
        options:
          - pre-production
          - production
          - both
        default: both

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: 🔎 Validate ${{ inputs.tag }}
    # Temporarily pause manual and reusable Kubernetes deployments.
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.release.outputs.image-tag }}

    steps:
      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📲 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Validate release and images
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a stable vX.Y.Z release tag, received '$RELEASE_TAG'." >&2
            exit 1
          fi

          release_state=$(gh api \
            "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            --jq 'if .draft then "draft" elif .prerelease then "prerelease" else "stable" end')

          if [[ "$release_state" != "stable" ]]; then
            echo "Release '$RELEASE_TAG' is $release_state; only published stable releases can deploy." >&2
            exit 1
          fi

          image_tag="${RELEASE_TAG#v}"
          for image in claim-api claim-web; do
            docker buildx imagetools inspect \
              "ghcr.io/$REGISTRY_OWNER/$image:$image_tag" >/dev/null
          done

          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"

  deploy-pre-production:
    name: 🚀 Deploy ${{ matrix.image }} to pre-production
    if: ${{ inputs.environment == 'pre-production' || inputs.environment == 'both' }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claim-api
            namespace: claim-api-prep
            deployment: claim-api-prep
            container: claim-api
          - image: claim-web
            namespace: claim-web-prep
            deployment: claim-web-prep
            container: claim-web
    uses: anthonypillot/actions/.github/workflows/kubernetes-deployment.yaml@v1
    with:
      registry_url: ghcr.io
      registry_username: ${{ github.repository_owner }}
      deployment_name: ${{ matrix.deployment }}
      container_name: ${{ matrix.container }}
      environment: pre-production
      image_name: ${{ matrix.image }}
      image_tag: ${{ needs.validate.outputs.image-tag }}
      namespace_name: ${{ matrix.namespace }}
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}

  deploy-production:
    name: 🚀 Deploy ${{ matrix.image }} to production
    if: ${{ inputs.environment == 'production' || inputs.environment == 'both' }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claim-api
            namespace: claim-api-prod
            deployment: claim-api-prod
            container: claim-api
          - image: claim-web
            namespace: claim-web-prod
            deployment: claim-web-prod
            container: claim-web
    uses: anthonypillot/actions/.github/workflows/kubernetes-deployment.yaml@v1
    with:
      registry_url: ghcr.io
      registry_username: ${{ github.repository_owner }}
      deployment_name: ${{ matrix.deployment }}
      container_name: ${{ matrix.container }}
      environment: production
      image_name: ${{ matrix.image }}
      image_tag: ${{ needs.validate.outputs.image-tag }}
      namespace_name: ${{ matrix.namespace }}
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}
