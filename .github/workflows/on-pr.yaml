name: 🏗️ On Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: on-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    name: 📄 Extract version
    uses: anthonypillot/actions/.github/workflows/extract-version.yaml@main

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v6

      - name: 🐰 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏷️ Check package versions
        run: bun run version:check

      - name: 🧹 Lint
        run: bun run lint

      - name: 📝 Check formatting
        run: bun run format:check

      - name: 🔎 Typecheck
        run: bun run typecheck

      - name: 🔎 Check web
        run: bun run --cwd packages/web check

      - name: 🌐 Install Playwright browser
        run: bun run --cwd packages/web playwright install --with-deps chromium

      - name: 🧪 Test
        run: bun run test

      - name: 🏗️ Build
        run: bun run build

  images:
    name: 🐳 Build and publish ${{ matrix.image }} preview
    needs: [extract, build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claim-api
            dockerfile: packages/api/Dockerfile
          - image: claim-web
            dockerfile: packages/web/Dockerfile
    uses: ./.github/workflows/build-publish-image.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      publish: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.extract.outputs.result }}
      version: ${{ needs.extract.outputs.result }}
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
