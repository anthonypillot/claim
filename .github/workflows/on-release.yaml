name: 🏷️ On release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: 🧪 Verify tagged source
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: 📥 Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🐰 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏷️ Check release version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vX.Y.Z release, received '$TAG'." >&2
            exit 1
          fi
          bun scripts/check-versions.mjs "${TAG#v}"

      - name: 🧪 Verify tagged source
        run: bun run verify

  verify-images:
    name: 🐳 Verify ${{ matrix.image }} release image
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claim-api
            dockerfile: packages/api/Dockerfile
          - image: claim-web
            dockerfile: packages/web/Dockerfile

    steps:
      - name: 📥 Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          platforms: linux/amd64
          tags: ${{ matrix.image }}:release-smoke
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: 🚀 Start image
        run: >-
          docker run --detach --name "${{ matrix.image }}-release-smoke" --publish 3000:3000
          --env PUBLIC_API_URL=http://127.0.0.1:3000
          --env PUBLIC_WEB_URL=http://127.0.0.1:3000
          --env ORIGIN=http://127.0.0.1:3000
          "${{ matrix.image }}:release-smoke"

      - name: ❤️ Check image health
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/health

      - name: 🛑 Stop image
        if: always()
        run: docker rm --force "${{ matrix.image }}-release-smoke" || true

  publish:
    name: 🐳 Publish ${{ matrix.image }} release
    needs: verify-images
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    strategy:
      matrix:
        include:
          - image: claim-api
            dockerfile: packages/api/Dockerfile
          - image: claim-web
            dockerfile: packages/web/Dockerfile

    steps:
      - name: 🏷️ Validate and derive image tags
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a stable vX.Y.Z release, received '$TAG'." >&2
            exit 1
          fi

          version="${TAG#v}"
          IFS=. read -r major minor _ <<< "$version"
          printf 'version=%s\nmajor=%s\nminor=%s.%s\n' "$version" "$major" "$major" "$minor" >> "$GITHUB_OUTPUT"

      - name: 📥 Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🔎 Resolve release revision
        id: revision
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📲 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: 🐳 Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
